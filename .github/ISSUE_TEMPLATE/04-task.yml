name: Task
description: A specific piece of work
type: Task
body:
  - type: textarea
    id: detail
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer confirms this is complete.
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate (hours)
      placeholder: "2"
    validations:
      required: false
