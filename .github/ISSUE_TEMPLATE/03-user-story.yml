name: User Story
description: A detailed user story to deliver a requirement partially or fully
type: User Story
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a [role], I want [capability], so that [benefit].
      placeholder: As a warehouse supervisor, I want to see stock by bin, so that I can pick without walking the floor.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we confirm this is done.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent requirement
      description: The Requirement this delivers against, for example #123.
    validations:
      required: false
