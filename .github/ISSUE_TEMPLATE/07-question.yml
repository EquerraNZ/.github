name: Question
description: Open questions or decisions
type: Question
body:
  - type: textarea
    id: question
    attributes:
      label: Question or decision needed
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is blocked or affected while this is open.
    validations:
      required: false
  - type: input
    id: needed_by
    attributes:
      label: Needed by
      description: Date a decision is required, if there is one.
    validations:
      required: false
